<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Prompter">
<meta name="theme-color" content="#000000">
<title>Teleprompter</title>
<style>
  :root { --fg:#fff; --dim:#6b6b6b; --accent:#ffcc00; --bg:#000; --panel:#1b1b1b; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font:inherit; color:inherit; background:#2a2a2a; border:1px solid #444; border-radius:10px;
    padding:10px 14px; cursor:pointer; touch-action:manipulation; }
  button.primary { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  button.on { background:#c62828; border-color:#c62828; }
  .hidden { display:none !important; }

  /* ---------- editor ---------- */
  #editor { display:flex; flex-direction:column; height:100%; max-width:900px; margin:0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); gap:12px; }
  #editor h1 { margin:0; font-size:22px; }
  #text { flex:1; width:100%; resize:none; background:var(--panel); color:var(--fg); border:1px solid #333;
    border-radius:12px; padding:14px; font:inherit; font-size:17px; line-height:1.5; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; }
  .row label { display:flex; gap:8px; align-items:center; }
  .sync { display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:14px; color:#aaa; }
  .sync button { padding:6px 10px; font-size:14px; }
  .warn { background:#4a3b00; color:#ffe08a; padding:10px 12px; border-radius:10px; font-size:14px; }

  /* ---------- prompter ---------- */
  #prompter { position:fixed; inset:0; overflow:hidden; background:#000; touch-action:none; }
  #stage { position:absolute; inset:0; }
  #stage.mirror { transform: scaleX(-1); }
  #content { position:relative; padding:0 6vw 100vh; line-height:1.35; font-weight:600;
    will-change: transform; }
  #content .w { transition: color .25s; }
  #content .w.done { color:var(--dim); }
  #content .gap { display:block; height:.6em; }
  #marker { position:absolute; left:0; width:0; height:0; border-top:14px solid transparent;
    border-bottom:14px solid transparent; border-left:18px solid var(--accent); transform:translateY(-50%); }
  #bar { position:absolute; top:0; left:0; right:0; display:flex; gap:8px; flex-wrap:wrap; align-items:center;
    padding: max(8px, env(safe-area-inset-top)) 10px 8px; background:linear-gradient(#000e, #0000);
    opacity:.35; transition:opacity .3s; z-index:2; }
  #bar:hover, #bar.show { opacity:1; }
  #bar button { padding:8px 12px; font-size:15px; }
  #heard { position:absolute; left:0; right:0; bottom:0; padding:6px 12px max(6px, env(safe-area-inset-bottom));
    font-size:13px; color:#777; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:2; }
</style>
</head>
<body>

<section id="editor">
  <h1>Teleprompter</h1>
  <div id="sync" class="sync hidden">
    <span id="syncStatus"></span>
    <span style="flex:1"></span>
    <button id="syncOn">Zapnout synchronizaci</button>
    <button id="syncShare" class="hidden">Připojit další zařízení</button>
  </div>
  <div id="nosr" class="warn hidden">Tento prohlížeč neumí rozpoznávat řeč. Na iPhonu použij Safari, na počítači Chrome nebo Safari. Text půjde posouvat jen ručně.</div>
  <textarea id="text" placeholder="Sem vlož text…"></textarea>
  <div class="row">
    <label>Písmo <input id="size" type="range" min="20" max="120" step="2"> <span id="sizeVal"></span></label>
    <label><input id="mirror" type="checkbox"> Zrcadlit</label>
    <span style="flex:1"></span>
    <button id="go" class="primary">Spustit ▶</button>
  </div>
</section>

<section id="prompter" class="hidden">
  <div id="stage">
    <div id="content"></div>
    <div id="marker"></div>
  </div>
  <div id="bar">
    <button id="back">✎ Text</button>
    <button id="mic">🎤 Start</button>
    <button id="top">⤒ Začátek</button>
    <button id="smaller">A−</button>
    <button id="bigger">A+</button>
    <button id="flip">⇋ Zrcadlo</button>
  </div>
  <div id="heard"></div>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // ---------- settings ----------
  const store = {
    get(k, d) { try { const v = localStorage.getItem('tp_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('tp_' + k, JSON.stringify(v)); } catch {} }
  };
  const defaultSize = Math.round(Math.min(72, Math.max(30, innerWidth / 14)));
  let fontSize = store.get('size', defaultSize);
  let mirror = store.get('mirror', false);
  $('text').value = store.get('text', '');
  $('size').value = fontSize; $('sizeVal').textContent = fontSize;
  $('mirror').checked = mirror;
  if (!SR) $('nosr').classList.remove('hidden');

  $('text').addEventListener('input', () => { store.set('text', $('text').value); Sync.changed(); });
  $('size').addEventListener('input', e => setSize(+e.target.value));
  $('mirror').addEventListener('change', e => setMirror(e.target.checked));

  // ---------- sync between devices ----------
  // Firestore document rooms/<team code>; the long random code in the link is the only key.
  const FIREBASE = { projectId: 'teleprompter-1be64' };
  const Sync = (() => {
    if (!FIREBASE.projectId) return { changed() {} };
    $('sync').classList.remove('hidden');
    let room = store.get('room', null);
    let dirty = false, ver = 0, busy = false, timer = null;
    // opening the team link on a device joins that team (the team text wins)
    function join() {
      const m = location.hash.match(/[#&]t=([a-z0-9]{20,64})/);
      if (!m) return;
      room = m[1]; store.set('room', room); dirty = false;
      history.replaceState(null, '', location.pathname + location.search);
    }
    join();
    const url = () => `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/rooms/${room}`;
    const status = t => { $('syncStatus').textContent = t; };
    const offline = () => status('⚠ Bez připojení – text je uložený jen tady');
    function ui() {
      $('syncOn').classList.toggle('hidden', !!room);
      $('syncShare').classList.toggle('hidden', !room);
      if (!room) status('Text je uložený jen v tomhle zařízení');
    }
    async function push() {
      busy = true; status('Ukládám…');
      const v = ver;
      try {
        const r = await fetch(url(), { method: 'PATCH', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fields: { body: { stringValue: $('text').value }, updatedAt: { integerValue: String(Date.now()) } } }) });
        if (!r.ok) throw new Error(r.status);
        if (v === ver) dirty = false;
        status('✓ Synchronizováno');
      } catch { offline(); }
      busy = false;
    }
    async function pull() {
      if (!room || busy || document.hidden || $('editor').classList.contains('hidden')) return;
      if (dirty) return push();
      busy = true;
      try {
        const r = await fetch(url());
        if (r.status === 404) {                       // new team: upload what we have
          busy = false;
          return $('text').value ? push() : status('✓ Synchronizováno');
        }
        if (!r.ok) throw new Error(r.status);
        const doc = await r.json();
        const body = doc.fields?.body?.stringValue ?? '';
        if (!dirty && body !== $('text').value) { $('text').value = body; store.set('text', body); }
        status('✓ Synchronizováno');
      } catch { offline(); }
      busy = false;
    }
    function newCode() {
      const abc = 'abcdefghijkmnpqrstuvwxyz23456789';
      return Array.from(crypto.getRandomValues(new Uint8Array(24)), b => abc[b % abc.length]).join('');
    }
    $('syncOn').onclick = () => { room = newCode(); store.set('room', room); ui(); push(); };
    $('syncShare').onclick = async () => {
      const link = location.origin + location.pathname + '#t=' + room;
      if (navigator.share) {
        try { await navigator.share({ title: 'Teleprompter', url: link }); return; }
        catch (e) { if (e.name === 'AbortError') return; }
      }
      try { await navigator.clipboard.writeText(link); status('Odkaz zkopírovaný – otevři ho na druhém zařízení'); }
      catch { prompt('Otevři tenhle odkaz na druhém zařízení:', link); }
    };
    setInterval(pull, 5000);
    document.addEventListener('visibilitychange', pull);
    addEventListener('hashchange', () => { join(); ui(); pull(); });
    ui(); pull();
    return {
      pull,
      changed() {
        if (!room) return;
        dirty = true; ver++;
        clearTimeout(timer);
        timer = setTimeout(function save() { busy ? (timer = setTimeout(save, 300)) : push(); }, 800);
      }
    };
  })();

  function setSize(v) {
    fontSize = Math.max(20, Math.min(120, v));
    store.set('size', fontSize);
    $('size').value = fontSize; $('sizeVal').textContent = fontSize;
    $('content').style.fontSize = fontSize + 'px';
    layout();
  }
  function setMirror(v) {
    mirror = v; store.set('mirror', v); $('mirror').checked = v;
    $('stage').classList.toggle('mirror', v);
  }

  // ---------- text -> comparable words ----------
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');

  // abbreviations are read out in full
  const ABBR = {
    napr: ['napriklad'], atd: ['a', 'tak', 'dale'], apod: ['a', 'podobne'], tzn: ['to', 'znamena'],
    tj: ['to', 'jest'], tzv: ['takzvany'], resp: ['respektive'], mj: ['mimo', 'jine'], cca: ['cirka'],
    popr: ['popripade'], kc: ['korun'], ks: ['kusu']
  };
  // one written token -> normalized spoken words ("10%" -> 10 procent, "např." -> napriklad)
  function tokenParts(tok) {
    const t = tok.replace(/%/g, ' procent ').replace(/&/g, ' a ').replace(/€/g, ' eur ').replace(/\+/g, ' plus ')
      .replace(/[-–—\/]/g, ' ').replace(/(\d)(\p{L})/gu, '$1 $2').replace(/(\p{L})(\d)/gu, '$1 $2');
    const out = [];
    for (const p of t.split(/\s+/)) {
      const n = norm(p);
      if (n) out.push(...(ABBR[n] || [n]));
    }
    return out;
  }

  // Czech number words -> digits, applied to both the script and the speech,
  // so "2026" matches "dva tisíce dvacet šest" either way round
  const NUM = {
    nula: 0, jeden: 1, jedna: 1, jedno: 1, jednoho: 1, jedne: 1, jednom: 1, dva: 2, dve: 2, dvou: 2, dvema: 2,
    tri: 3, trech: 3, trem: 3, tremi: 3, ctyri: 4, ctyrech: 4, ctyrem: 4, ctyrmi: 4, pet: 5, peti: 5, sest: 6, sesti: 6,
    sedm: 7, sedmi: 7, osm: 8, osmi: 8, devet: 9, deviti: 9, deset: 10, deseti: 10, jedenact: 11, dvanact: 12,
    trinact: 13, ctrnact: 14, patnact: 15, sestnact: 16, sedmnact: 17, osmnact: 18, devatenact: 19,
    dvacet: 20, dvaceti: 20, tricet: 30, triceti: 30, ctyricet: 40, ctyriceti: 40, padesat: 50, padesati: 50,
    sedesat: 60, sedesati: 60, sedmdesat: 70, sedmdesati: 70, osmdesat: 80, osmdesati: 80, devadesat: 90, devadesati: 90
  };
  const HUNDRED = new Set(['sto', 'ste', 'sta', 'set', 'stech']);
  const MULT = { tisic: 1e3, tisice: 1e3, tisicu: 1e3, tisici: 1e3, milion: 1e6, miliony: 1e6, milionu: 1e6, miliarda: 1e9, miliardy: 1e9, miliard: 1e9 };
  const isDigits = n => /^\d+$/.test(n);
  const isNum = n => n in NUM || HUNDRED.has(n) || n in MULT || isDigits(n);

  // items: [{n, spans}] -> number runs merged into one digit item
  function canon(items) {
    const out = [];
    for (let i = 0; i < items.length;) {
      if (!isNum(items[i].n)) { out.push(items[i++]); continue; }
      let total = 0, cur = 0, prevDigits = false;
      const spans = [];
      for (; i < items.length && isNum(items[i].n); i++) {
        const n = items[i].n;
        if (isDigits(n)) {
          // "1 000 000" -> thousands groups
          cur = prevDigits && n.length === 3 ? cur * 1000 + +n : cur + +n;
          prevDigits = true;
        } else {
          prevDigits = false;
          if (n in NUM) cur += NUM[n];
          else if (HUNDRED.has(n)) cur = (cur || 1) * 100;
          else { total += (cur || 1) * MULT[n]; cur = 0; }
        }
        if (items[i].spans) spans.push(...items[i].spans);
      }
      out.push({ n: String(total + cur), spans });
    }
    return out;
  }
  const spokenWords = t => canon(t.split(/\s+/).flatMap(tokenParts).map(n => ({ n }))).map(x => x.n);

  let W = [];       // comparable words of the script
  let wSpans = [];  // spans displaying each W word
  let pos = 0;      // index of the next word to be read (confirmed by speech)

  function build(text) {
    const content = $('content');
    content.innerHTML = '';
    const items = [];
    const paras = text.replace(/\r/g, '').split(/\n\s*\n/);
    paras.forEach((para, pi) => {
      if (pi) content.appendChild(Object.assign(document.createElement('span'), { className: 'gap' }));
      para.split('\n').forEach((line, li) => {
        if (li) content.appendChild(document.createElement('br'));
        line.split(/\s+/).filter(Boolean).forEach(tok => {
          const span = document.createElement('span');
          span.textContent = tok;
          const parts = tokenParts(tok);
          if (parts.length) span.className = 'w';
          parts.forEach(n => items.push({ n, spans: [span] }));
          content.appendChild(span);
          content.appendChild(document.createTextNode(' '));
        });
      });
    });
    const c = canon(items);
    W = c.map(x => x.n);
    wSpans = c.map(x => x.spans);
  }

  // ---------- fuzzy matching ----------
  function lev(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 3;
    let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      const cur = [i];
      for (let j = 1; j <= b.length; j++)
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = cur;
    }
    return prev[b.length];
  }
  // 0..1 similarity; tolerant of Czech word endings and small recognition errors
  function sim(a, b) {
    if (a === b) return 1;
    const m = Math.min(a.length, b.length);
    if (m < 4) return 0;
    const p = Math.max(3, m - 2);
    if (a.slice(0, p) === b.slice(0, p)) return 0.8;
    const d = lev(a, b);
    if (d <= 1) return 0.8;
    if (m >= 7 && d <= 2) return 0.6;
    return 0;
  }
  const weight = w => w.length <= 2 ? 0.4 : w.length <= 3 ? 0.7 : 1;

  // how well do the last spoken words line up with the script ending at index e?
  // gaps inside the matched run cost points; older words that no longer align are free
  function alignScore(spoken, e) {
    let si = spoken.length - 1, sj = e, score = 0, misses = 0, paid = 0;
    while (si >= 0 && sj >= 0 && misses <= 3) {
      const s = sim(spoken[si], W[sj]);
      if (s) { score += s * weight(W[sj]); paid = misses; si--; sj--; continue; }
      misses++;
      if (sj > 0 && sim(spoken[si], W[sj - 1])) { sj--; continue; }       // reader skipped a word
      if (si > 0 && sim(spoken[si - 1], W[sj])) { si--; continue; }       // recognizer added a word
      si--; sj--;
    }
    return score - paid * 0.3;
  }

  const AHEAD = 40, BACK = 40;
  let lastHeard = -1e9;
  function handleSpeech(transcript) {
    lastHeard = performance.now();
    $('heard').textContent = transcript.trim().split(/\s+/).slice(-12).join(' ');
    const spoken = spokenWords(transcript).slice(-8);
    if (!spoken.length || !W.length) return;
    const last = spoken[spoken.length - 1];
    let best = -1, bestScore = -Infinity;
    for (let e = Math.max(0, pos - BACK); e < Math.min(W.length, pos + AHEAD); e++) {
      if (!sim(last, W[e])) continue;
      const score = alignScore(spoken, e);
      const d = e - pos;
      let need, adj;
      if (d >= 0) { need = d <= 2 ? 0.8 : d <= 15 ? 1.6 : 2.5; adj = score - d * 0.03; }  // ahead
      else if (d >= -2) { need = 0; adj = score; }                                         // where we are
      else { need = 3; adj = score - 0.5 + d * 0.02; }                                    // re-reading: needs strong evidence
      if (score >= need && adj > bestScore) { bestScore = adj; best = e; }
    }
    if (best < 0) return;
    const p = best + 1;
    if (p > pos || p < pos - 3) setPos(p, true);
  }

  // ---------- position & smooth scrolling ----------
  let dp = 0;          // displayed position in words (fractional), glides ahead of pos while speaking
  let pace = 2.3;      // words per second, learned from the speaker
  let hist = [];       // recent {t, p} for pace estimate
  const LEAD = 1.5;    // how far the display may run ahead of confirmed speech
  let lines = [], lineOf = [];
  let offset = 0, target = 0;
  const readLine = () => Math.round(innerHeight * 0.32);

  function setPos(p, fromSpeech) {
    p = Math.max(0, Math.min(W.length, p));
    const lo = Math.min(p, pos), hi = Math.max(p, pos);
    for (let i = lo; i < hi; i++) wSpans[i].forEach(s => s.classList.toggle('done', i < p));
    if (fromSpeech && p > pos) {
      const now = performance.now();
      hist.push({ t: now, p });
      hist = hist.filter(h => now - h.t < 6000);
      const h0 = hist[0], secs = (now - h0.t) / 1000;
      if (secs > 1.5) pace = Math.max(1.2, Math.min(4, pace * 0.5 + (p - h0.p) / secs * 0.5));
    } else hist = [];
    pos = p;
    if (p < dp - LEAD || !fromSpeech) dp = p;
  }

  // line geometry, so the text moves continuously as you read along a line
  function measure() {
    lines = []; lineOf = [];
    for (let i = 0; i < W.length; i++) {
      const s = wSpans[i][0], top = s.offsetTop, L = lines[lines.length - 1];
      if (!L || Math.abs(top - L.top) > 2) lines.push({ top, h: s.offsetHeight, a: i, b: i });
      else L.b = i;
      lineOf[i] = lines.length - 1;
    }
  }
  function lineEnd(k) { const L = lines[k], N = lines[k + 1]; return N ? N.top : L.top + L.h; }
  function yAt(d) {
    if (!lines.length) return 0;
    d = Math.max(0, Math.min(W.length, d));
    const i = Math.min(W.length - 1, Math.floor(d)), k = lineOf[i], L = lines[k];
    return L.top + (lineEnd(k) - L.top) * (i - L.a + (d - i)) / (L.b - L.a + 1);
  }
  function dpAt(y) {
    if (!lines.length) return 0;
    for (let k = 0; k < lines.length; k++) {
      const L = lines[k], end = lineEnd(k);
      if (y < end || k === lines.length - 1)
        return L.a + Math.max(0, Math.min(1, (y - L.top) / (end - L.top))) * (L.b - L.a + 1);
    }
  }
  function manualScroll(dy) {
    dp = Math.max(0, Math.min(W.length, dpAt(yAt(dp) + dy)));
    const d = dp;
    setPos(Math.floor(d));
    dp = d;
    target = Math.max(0, yAt(dp) - readLine());
    offset = target;
    showBar();
  }

  let lastT = 0;
  function frame(t) {
    const dt = Math.min(0.1, (t - lastT) / 1000 || 0);
    lastT = t;
    if (dp < pos) dp += (pos - dp) * Math.min(1, dt * 8);                                  // catch up with speech
    else if (listening && t - lastHeard < 900) dp = Math.min(pos + LEAD, dp + pace * dt);    // glide while talking
    target = Math.max(0, yAt(dp) - readLine());
    offset += (target - offset) * Math.min(1, dt * 7);
    if (Math.abs(target - offset) < 0.3) offset = target;
    $('content').style.transform = `translateY(${-offset}px)`;
    requestAnimationFrame(frame);
  }

  // ---------- microphone ----------
  let rec = null, listening = false;
  function startMic() {
    if (!SR) { alert('Tento prohlížeč neumí rozpoznávat řeč. Na iPhonu použij Safari, na počítači Chrome nebo Safari.'); return; }
    listening = true; micUI();
    if (!rec) {
      rec = new SR();
      rec.lang = 'cs-CZ';
      rec.continuous = true;
      rec.interimResults = true;
      rec.onresult = e => {
        // only the tail matters; walk back until we have enough words
        let t = '';
        for (let i = e.results.length - 1; i >= 0 && t.split(/\s+/).length < 16; i--)
          t = e.results[i][0].transcript + ' ' + t;
        handleSpeech(t);
      };
      rec.onerror = e => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          listening = false; micUI();
          alert('Mikrofon nebo rozpoznávání řeči není povolené. Povol ho v nastavení prohlížeče.');
        }
      };
      // browsers end the session after silence or a time limit -> restart while we want to listen
      rec.onend = () => { if (listening) setTimeout(restart, 120); };
    }
    try { rec.start(); } catch {}
  }
  function restart() { if (!listening) return; try { rec.start(); } catch { setTimeout(restart, 400); } }
  function stopMic() { listening = false; micUI(); try { rec && rec.stop(); } catch {} }
  function micUI() {
    $('mic').textContent = listening ? '■ Stop' : '🎤 Start';
    $('mic').classList.toggle('on', listening);
  }

  // ---------- screen wake lock ----------
  let wake = null;
  async function keepAwake() { try { wake = await navigator.wakeLock.request('screen'); } catch {} }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !$('prompter').classList.contains('hidden')) keepAwake();
  });

  // ---------- screens ----------
  function openPrompter() {
    build($('text').value);
    $('editor').classList.add('hidden');
    $('prompter').classList.remove('hidden');
    $('content').style.fontSize = fontSize + 'px';
    setMirror(mirror);
    pos = 0; hist = [];
    setPos(0);
    layout();
    offset = target;
    $('heard').textContent = '';
    keepAwake();
    showBar();
  }
  function closePrompter() {
    stopMic();
    try { wake && wake.release(); } catch {}
    $('prompter').classList.add('hidden');
    $('editor').classList.remove('hidden');
  }

  let barTimer;
  function showBar() {
    $('bar').classList.add('show');
    clearTimeout(barTimer);
    barTimer = setTimeout(() => $('bar').classList.remove('show'), 2500);
  }

  $('go').onclick = openPrompter;
  $('back').onclick = closePrompter;
  $('mic').onclick = () => listening ? stopMic() : startMic();
  $('top').onclick = () => { setPos(0); offset = target = 0; };
  $('smaller').onclick = () => setSize(fontSize - 4);
  $('bigger').onclick = () => setSize(fontSize + 4);
  $('flip').onclick = () => setMirror(!mirror);

  // manual control: wheel, touch drag, keyboard
  $('prompter').addEventListener('wheel', e => { e.preventDefault(); manualScroll(e.deltaY); }, { passive: false });
  let touchY = null;
  $('stage').addEventListener('touchstart', e => { touchY = e.touches[0].clientY; showBar(); }, { passive: true });
  $('stage').addEventListener('touchmove', e => {
    if (touchY === null) return;
    const y = e.touches[0].clientY;
    manualScroll(touchY - y); touchY = y;
  }, { passive: true });
  $('stage').addEventListener('touchend', () => { touchY = null; });
  $('stage').addEventListener('click', showBar);
  document.addEventListener('keydown', e => {
    if ($('prompter').classList.contains('hidden')) return;
    const line = fontSize * 1.35;
    if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); manualScroll(e.key === 'PageDown' ? line * 4 : line); }
    else if (e.key === 'ArrowUp' || e.key === 'PageUp') { e.preventDefault(); manualScroll(e.key === 'PageUp' ? -line * 4 : -line); }
    else if (e.key === ' ') { e.preventDefault(); listening ? stopMic() : startMic(); }
    else if (e.key === 'Escape') closePrompter();
    else if (e.key === 'm') setMirror(!mirror);
  });

  // first line starts at the reading line, marked by the yellow arrow
  function layout() {
    $('marker').style.top = readLine() + 'px';
    $('content').style.paddingTop = (readLine() - fontSize * 0.7) + 'px';
    if (!$('prompter').classList.contains('hidden')) measure();
  }
  addEventListener('resize', layout);

  requestAnimationFrame(frame);

  // exposed for testing in the console
  window.tp = { handleSpeech, spokenWords, get pos() { return pos; }, get dp() { return dp; }, get pace() { return pace; }, get words() { return W; } };
})();
</script>
</body>
